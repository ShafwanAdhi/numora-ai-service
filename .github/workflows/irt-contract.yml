name: IRT contract compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install schema validator
        run: python -m pip install jsonschema==4.26.0
      - name: Schema and shared JavaScript/Python conformance vectors
        run: python contracts/irt-calibration-v1/test_contract.py
      - name: Python service contract import boundary
        run: python -m unittest discover -s tests/service -p test_irt_contracts.py
